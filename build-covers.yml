name: Build cover map

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Only process N images (0 = all)'
        required: false
        default: '0'
  push:
    paths:
      - 'build-cover-map.js'
      - '.github/workflows/build-covers.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-tesseract-v1

      - name: Install
        run: npm install tesseract.js

      - name: Build cover map
        env:
          LIMIT: ${{ github.event.inputs.limit || '0' }}
        run: node build-cover-map.js

      - name: Commit cover-map.json
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add cover-map.json
          git diff --staged --quiet || git commit -m "chore: build cover-map.json"
          git push
